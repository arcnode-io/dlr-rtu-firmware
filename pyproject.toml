[project]
name = "dlr-operating-envelope"
version = "1.0.0-beta"
# Reason: dnp3-python 0.3.0b2 ships prebuilt wheels for cp38/cp39/cp310 only;
# newer Pythons fail at source build (opendnp3 CMake < 3.5 removed in CMake 3.10+).
# Other arcnode Python repos run 3.13; this repo deviates due to the native
# binding constraint. See ems handoff §A and dnp3-python pypi page.
requires-python = ">=3.10,<3.11"
dependencies = [
    "adafruit-blinka>=8.0.0",
    "adafruit-circuitpython-dht>=3.7.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "aiomqtt>=2.0.0",
    "dnp3-python>=0.3.0b2",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "black[d]>=26.3.1",
    "deptry>=0.23.0",
    "filelock>=3.0.0",
    "paramiko>=3.0.0",
    "pip>=25.1.1",
    "pip-audit>=2.6.1",
    "poethepoet>=0.32.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8.4",
    "testcontainers>=4.0.0",
    "ty>=0.0.18",
    "types-paramiko>=4.0",
]

[tool.deptry.per_rule_ignores]
# Reason: pytest is a dev-only import allowed in colocated `*_test.py` files under src/.
DEP004 = ["pytest"]

[tool.deptry.package_module_name_map]
# Package-name → import-name overrides where they differ.
pyyaml = "yaml"
"adafruit-circuitpython-dht" = "adafruit_dht"
"adafruit-blinka" = "board"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_also = [
    # Don't complain about abstract methods that aren't implemented
    "@(abc\\.)?abstractmethod",
    # Don't complain about type checking blocks
    "if TYPE_CHECKING:",
    # Don't complain about ellipsis in protocols
    "\\.\\.\\.",
]
# Show which lines are missing coverage
show_missing = true
# Skip files with 100% coverage
skip_covered = false

[tool.poe.tasks]
depcheck = "deptry ."
format = "black ."
lint = "ruff check"
typecheck = "ty check"
audit-src = "bandit -r src/* -s B101,B104"
audit-packages = "pip-audit --ignore-vuln GHSA-4xh5-x5gv-qwph --ignore-vuln CVE-2026-3219"
security = ["audit-src", "audit-packages"]
checks = ["depcheck", "format", "lint", "typecheck", "security"]
unit = "pytest -vv src/*"
# Reason: absolute paths work around pytest-xdist #971 (relative path resolution bug)
integration = "bash -c 'pytest -d --tx ssh=${PI_HOST:-pi@raspberrypi.local}//python=${PI_PYTHON:-/home/pi/python-circuitpython/.venv/bin/python} --rsyncdir $(realpath src) --rsyncdir $(realpath tests) $(realpath tests/test_integration.py) -p no:warnings'"
hardware-in-loop = "pytest -vv tests/test_hil.py"
e2e = "pytest -vv -p no:xdist tests/test_dnp3_e2e.py"
healthcheck = "bash -c 'ssh -o ConnectTimeout=10 -o BatchMode=yes ${PI_HOST:-pi@raspberrypi.local} echo NETWORK_READY'"
test = ["unit", "healthcheck", "integration", "hardware-in-loop"]
cover = "pytest -vv --cov --cov-branch --cov-report=term-missing src/"
review = "claude 'run code-reviewer agent against diff for simplicity and elegance'"
commit = "bash -c 'uv run poe checks && uv run poe test && uv run poe review && git add -A && git cz && git push'"
